name: Linux Ubuntu 22.04

on:
  push:
    branches: [linux-port]
    tags: ['v*-linux']
  pull_request:
    branches: [linux-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxcb-cursor0 fonts-noto-cjk xvfb
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-linux-build.txt
      - name: Test and build portable package
        run: ./build-linux.sh
      - name: Start packaged app on X11
        run: xvfb-run -a dist/GooglePiggy/googlepiggy --state-dir /tmp/googlepiggy-ci --no-observe --no-update-check --quit-after 3 --capture qa/linux-x11.png
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: GooglePiggy-linux-x86_64
          path: |
            dist/GooglePiggy-*-linux-x86_64.tar.gz
            dist/SHA256SUMS.txt
            qa/linux-x11.png
          compression-level: 0
          retention-days: 7
