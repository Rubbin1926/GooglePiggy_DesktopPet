name: Linux Ubuntu 22.04

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build with stock Ubuntu 22.04 and Python 3.10
        run: |
          docker build --target build -f Dockerfile.linux -t googlepiggy-build .
          build_container=$(docker create googlepiggy-build)
          mkdir -p dist
          docker cp "$build_container:/app/dist/." ./dist/
          docker rm "$build_container"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: GooglePiggy-linux-x86_64
          path: |
            dist/GooglePiggy-*-linux-x86_64.tar.gz
            dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
